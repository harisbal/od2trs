[project]
site_name = "od2trs"
site_description = "Create trip chains (tours) from OD matrices"
site_url = "https://harisbal.github.io/od2trs/"
repo_url = "https://github.com/harisbal/od2trs"
repo_name = "harisbal/od2trs"
edit_uri = "edit/master/docs/"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Inputs" = "inputs.md" },
  { "Configuration" = "configuration.md" },
  { "Method" = "method.md" },
  { "API reference" = "api.md" },
  { "References" = "references.md" },
]

[project.theme]
language = "en"
logo = "assets/images/logo.svg"
favicon = "assets/images/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
tables = {}
toc.permalink = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
members_order = "source"

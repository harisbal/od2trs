[DEFAULT]
ncores = null
explore = true
# TODO at the moment if explore=true, export_flat overwrites results
export_flat = true

[TOURS]
run_tours_identification = true
max_tr_dists = {"Distance": [8000], "Traveltime": [8000]}
# Could include Activities but tcs not ready yet
distr_dims = [["Distancegroup", "Legs", "Timeperiods"]]
# The percentage of remaining groups threshold
# Check in analysis/summary_observed_trs.xlsx
distribution_percent_thresh = [1.0]
excl_edges_perc = [0.0, 0.01, 0.025, 0.05]

max_legs = [5]
trips_thresh = [1]

#compatibilities = {"Purpose": [["HB", "NHB"], ["NHB", "HB"], ["HB", "HB"], ["NHB", "NHB"]]}
#ordered_timeperiods = ["AM", "IP", "PM", "OP"]

ordered_timeperiods = ["OP1", "AM", "IP1", "IP2", "PM", "IP3", "OP2"]
compatibilities = {"Purpose": [["HBW", "NHBW"], ["HBO", "NHBO"], ["HBO", "NHBW"], ["NHBW", "HBW"], ["NHBW", "HBO"], ["NHBO", "HBO"], ["NHBW", "NHBO"], ["NHBO", "NHBW"], ["NHBO", "NHBO"], ["NHBW", "NHBW"], ["HBW", "HBW"], ["HBO", "HBO"]]}

#[[0, 900, 1800, 2700, 3600, 4500, 5400, 6300, 7000, 100000]]
dist_bins = null
# [900]
dist_bins_range = [900]

fromhome_direction = "FromHome"
tohome_direction = "ToHome"
nonhome_direction = "NonHomeBased"

# Dictionary to group purposes in OD
d_grp_purposes = {"HBW": "HBW", "HBO": "HBO",
                  "NHBW": "NHBW",
                  "NHBO": "NHBO",
                  "HB": "HB",
                  "NHB": "NHB"}

timeperiod_durations = {"OP1": ["00:00:00", "07:00:00"],
                        "AM" : ["07:00:00", "10:00:00"],
                        "IP1": ["10:00:00", "13:00:00"],
                        "IP2": ["13:00:00", "16:00:00"],
                        "PM" : ["16:00:00", "19:00:00"],
                        "IP3": ["19:00:00", "22:00:00"],
                        "OP2": ["22:00:00", "23:59:59"]}

#timeperiod_durations = {"AM" : ["07:00:00", "10:00:00"],
#                        "IP": ["13:00:00", "16:00:00"],
#                        "PM" : ["16:00:00", "19:00:00"],
#                        "OP": ["22:00:00", "23:59:59"]}

[OPTIMISATION]
# Optimisation parameters
run_optimisation = true
# Distribution contraints enabled or not
distribution_constraints_enabled = [true]
# Maximum allowed deviation between observed and estimated distributions' percentage
distribution_percentage_tolerance = [0.025]

submit_to_neos = false

# MIP empasis
# https://www.ibm.com/support/knprint(printowledgecenter/en/SS9UKU_12.4.0/com.ibm.cplex.zos.help/Parameters/topics/MIPEmphasis.html
# 0 Balance, 1 Feasibility, 2 Optimality
emphasis mip = 2

# Optimisation stop threshold expressed as percentage of total OD trips
mip tolerances lowercutoff = null
# in seconds
# 6*3600 = 21600
timelimit = 120

work memory = 25000
mip strategy probe = 1
# write to disk
mip strategy file = 2

[FILEPATHS_IN]
infolder = ./inputs/withoutLoops/lsoa/sample_perc_1
od = od.csv
trs_obs_info = trs_obs_info.csv
target_distr = target_distr.csv
distances = distances.csv
zones_info = zones_info.csv
trs_mdl_info = trs_mdl_info.pcl
trs_mdl_descr = trs_mdl_descr.pcl

[FILEPATHS_OUT]
outfolder = ./outputs/tests
od = od.csv
trs_mdl_descr = trs_mdl_descr.csv
trs_mdl_info = trs_mdl_info.csv
trs_mdl_distr = trs_mdl_distr.csv
trs_mdl_info_pcl = trs_mdl_info.pcl
trs_mdl_descr_pcl = trs_mdl_descr.pcl

target_distr = target_distr.csv
optim_results = optim_results.json
metadata = metadata.json
[DEFAULT]
# parallel threads (use negatives for non used cores)
ncores = -1
# TODO at the moment if explore=true, export_flat overwrites results
export_flat = true
low_memory = false

[TOURS]
run_tours_identification = true
assess_anonymity = false

max_legs = 3
max_costs = {"Distance": 50}
# For the continuous dimensions (e.g. distance we suffix with _grp)
distr_dims = ["Timeperiods_seq", "Transports_seq", "Distance_grp"]

# The percentage of excluded trips in od (is used to filter non frequent tour groups)
excl_distr_od_perc = 0.0
# The percentage of excluded trips in the graph after the simplification (centrality)
excl_edges_od_perc = 0.0

# Available methods ["pagerank", "subgraph_centrality", "subgraph_centrality_exp", "current_flow_betweeness", "current_flow_closeness", "eigenvector", "communicability_betweenness"]
simplify_net_method = "pagerank"
# simplify_net_place = ["begin", "iterative"]
simplify_net_place = "begin"

trips_thresh = 1
purpose_to_activities = {"HB": [["Home", "Other"]], "NHB": [["Other", "Other"]]}

from_home_direction = null
to_home_direction = null
non_home_direction = null

# Dictionary to group purposes in OD
d_grps = {"Purpose": {"HB": "HB", "NHB": "NHB"}}

# Keys should be ordered
timeperiod_durations = {"AM": ["06:00:00", "09:00:00"],
                        "PM": ["16:00:00", "20:00:00"]}

[OPTIMISATION]
# Optimisation parameters
run_optimisation = false
# Distribution constraints enabled or not
distribution_constraints_enabled = false
# Maximum allowed deviation between observed and estimated distributions' percentage
distribution_percentage_tolerance = 0.025

submit_to_neos = false

# MIP empasis
# https://www.ibm.com/support/knprint(printowledgecenter/en/SS9UKU_12.4.0/com.ibm.cplex.zos.help/Parameters/topics/MIPEmphasis.html
# 0 Balance, 1 Feasibility, 2 Optimality
emphasis mip = 0

# Optimisation stop threshold expressed as percentage of total OD trips
mip tolerances lowercutoff = null
# in seconds
# 6*3600 = 21600
timelimit = 50000

work memory = 30000
mip strategy probe = 0
# write to disk
mip strategy file = 1

[FILEPATHS_IN]
infolder = ./inputs/m2m
od = od-car.csv
distr_obs = distr_obs.csv
costs = distances.csv
zones_info = zones.csv
trs_info_mdl = trs_info_mdl.pkl

[FILEPATHS_OUT]
outfolder = ./outputs/m2m
od = od.csv
graph = graph-od.pkl
trs_info_mdl = trs_info_mdl.pkl
distr_obs = distr_obs-filt.csv

optim_results = optim_results.json
metadata = metadata.json
config = config.ini
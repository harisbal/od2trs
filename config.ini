[DEFAULT]
# parallel threads (use negatives for cores not to use)
ncores = 1
explore = true
# TODO at the moment if explore=true, export_flat overwrites results
export_flat = true
low_memory = true

[TOURS]
run_tours_identification = true
max_costs = {"Distance": 7800, "Traveltime": 7800}
# Could include Activities but tcs not ready yet
distr_dims = [["Nolegs", "Distance_grp", "Traveltime_grp", "Timeperiods"]]
# The percentage of remaining trips in od (is used to filter non frequent tour groups)
excl_obs_trs_od_perc = [0.0]
excl_edges_od_perc = [0.0]

max_legs = [5]
trips_thresh = [1]

purpose_to_activities = {"HBW": [["Home", "Work"]], "HBO": [["Home", "Other"]], "NHBW": [["Work", "Other"], ["Work", "Work"]], "NHBO": [["Other", "Other"]]}

# Pass either a list or a single number to be used as interval
cost_bins = {"Distance": 900, "Traveltime": 900}
# {"Distance": 900, "Traveltime": 900}
# {"Distance": [0, 900, 1800, 2700, 3600, 4500, 5400, 6300, 7000]}

fromhome_direction = "FromHome"
tohome_direction = "ToHome"
nonhome_direction = "NonHomeBased"

# Dictionary to group purposes in OD
d_grp_purposes = {"HBW": "HBW", "HBO": "HBO",
                  "NHBW": "NHBW",
                  "NHBO": "NHBO",
                  "HB": "HB",
                  "NHB": "NHB"}

timeperiod_durations = {"OP1": ["00:00:00", "07:00:00"],
                        "AM" : ["07:00:00", "10:00:00"],
                        "IP1": ["10:00:00", "13:00:00"],
                        "IP2": ["13:00:00", "16:00:00"],
                        "PM" : ["16:00:00", "19:00:00"],
                        "IP3": ["19:00:00", "22:00:00"],
                        "OP2": ["22:00:00", "23:59:59"]}

[OPTIMISATION]
# Optimisation parameters
run_optimisation = true
warmstart = false
# Distribution constraints enabled or not
distribution_constraints_enabled = [true]
# Maximum allowed deviation between observed and estimated distributions' percentage
distribution_percentage_tolerance = [0.001]

submit_to_neos = false

# MIP emphasis
# https://www.ibm.com/support/knprint(printowledgecenter/en/SS9UKU_12.4.0/com.ibm.cplex.zos.help/Parameters/topics/MIPEmphasis.html
# 0 Balance, 1 Feasibility, 2 Optimality
emphasis mip = 2

# Optimisation stop threshold expressed as percentage of total OD trips
mip tolerances lowercutoff = null
# in seconds
# 6*3600 = 21600
timelimit = 500

work memory = 10000
mip strategy probe = 1
# write to disk
mip strategy file = 2

[FILEPATHS_IN]
infolder = ./tests/inputs/
od = od-small.csv
trs_obs_info = trs_obs_info-small.csv
tgt_distr = tgt_distr-small.csv
costs = costs.csv
zones_info = zones_info.csv

trs_mdl_info = trs_mdl_info.pkl
trs_mdl_descr = trs_mdl_descr.pkl

[FILEPATHS_OUT]
outfolder = ./tests/outputs

od = od.csv
graph = graph-od.gml
trs_mdl_descr = trs_mdl_descr.pkl
trs_mdl_info = trs_mdl_info.pkl
tgt_distr = tgt_distr.csv

optim_results = optim_results.json
metadata = metadata.json